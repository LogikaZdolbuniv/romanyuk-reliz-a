<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glow & Care | Набори</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>

    <header>
        <nav class="navbar">
            <div class="logo">GLOW & CARE</div>
            <div class="nav-menu">
                <div class="deve"><a href="index.html">Магазин</a></div>
                <div class="deve"><a href="index1.html">Про нас</a></div>
                <div class="cart-icon" onclick="toggleCart()">
                    🛒 <span id="cart-count">0</span>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <section class="hero sets-hero">
            <span class="subtitle" style="color: #fff; text-transform: uppercase; letter-spacing: 2px;">Limited Edition</span>
            <h1>Наші Фірмові Набори</h1>
            <p>Готові рішення для комплексного догляду за вашою шкірою</p>
        </section>

        <section class="products" id="sets-grid">
            </section>
    </main>

    <div id="cart-sidebar" class="sidebar">
        <div class="sidebar-header">
            <h2>Ваш кошик</h2>
            <span class="close-btn" onclick="toggleCart()">&times;</span>
        </div>
        <div id="cart-items"></div>
        <div class="cart-footer">
            <div class="total-row">
                <p>Разом: <span id="cart-total">0</span> грн</p>
                <button class="pay-btn" onclick="showPaymentError()">Оплатити</button>
            </div>
            <button class="checkout-btn">Оформити замовлення</button>
        </div>
    </div>

    <script src="script2.js"></script>
    <script>
        // Рендеримо тільки набори для цієї сторінки
        renderSets();
    </script>
</body>
</html>
